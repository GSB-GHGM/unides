<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --lac:#6B2D5C; --lac2:#A8455E; --mercan:#E0685A; --krem:#FBF3EC; --zemin:#F8F4F1; --kart:#FFFFFF; --cizgi:#DCE1EA; --yazi:#1B2333; --soluk:#5B6475;
  --sari:#FFF4CC; --sariK:#E9B000; --yesil:#E3F4E6; --yesilK:#1E7B34; --kirmizi:#FBE3DF; --kirmiziK:#B42318;
  --mavi:#F3E6EF; --maviK:#7A2E63; --gri:#EEF0F4; --turuncu:#FDEBDD; --turuncuK:#B5530F;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--zemin);color:var(--yazi);font:15px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--lac);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px}
header h1{font-size:16px;margin:0;font-weight:600;flex:1;line-height:1.2}
header h1 small{display:block;font-weight:400;opacity:.75;font-size:12px}
.hbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.24)}
main{max-width:1100px;margin:0 auto;padding:14px 16px 110px}
.kartlar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:19px;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--soluk)}
.kpi.vurgu{border-color:#9FD3AA;background:var(--yesil)}
.cipler{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.cip{border:1px solid var(--cizgi);background:var(--kart);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.cip.secili{background:var(--lac);color:#fff;border-color:var(--lac)}
.ara{width:100%;padding:10px 12px;border:1px solid var(--cizgi);border-radius:10px;background:#fff;margin-bottom:10px}
.liste{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.ilkart{background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;padding:10px 12px;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}
@media(max-width:560px){.ilkart .rozet{white-space:normal;text-align:right;max-width:42vw}.ilkart .ad{min-width:0;overflow-wrap:anywhere}}
.ilkart:hover{border-color:var(--lac2)}
.ilkart .ad{font-weight:600}
.ilkart .alt{font-size:12.5px;color:var(--soluk);grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px}
.rozet{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;white-space:nowrap}
.d1{background:var(--gri);color:#444}.d2{background:var(--kirmizi);color:var(--kirmiziK)}.d3{background:var(--sari);color:#7A5B00}
.d4{background:var(--mavi);color:var(--maviK)}.d5{background:var(--turuncu);color:var(--turuncuK)}.d6{background:var(--yesil);color:var(--yesilK)}
.dk{background:#FDE3D2;color:#9A3F12}.dkk{background:#E4F1E8;color:#2F6B45}
.a1{background:var(--sari);color:#7A5B00}.a2{background:var(--mavi);color:var(--maviK)}.a3{background:var(--yesil);color:var(--yesilK)}
.para{font-variant-numeric:tabular-nums}
.bos{color:var(--soluk);text-align:center;padding:30px}
/* panel */
.ort{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
.ort.acik{display:flex}
/* Sayfa içine gömülü ve çerçeve ekrandan uzunsa (Google Sites, bilgisayar): pencereler tıklanan yerin yanında açılır */
body.uzun .ort{position:absolute;inset:auto;top:0;left:0;right:0;align-items:flex-start}
body.uzun .panel{max-height:640px;border-radius:16px;box-shadow:0 12px 40px rgba(15,23,42,.35)}
body.uzun .kaydetbar{position:static;border:1px solid var(--cizgi);border-radius:12px;margin:0 auto 16px;max-width:760px}
body.uzun .toast{position:absolute;bottom:auto}
body.uzun .yukleniyor{position:absolute;align-items:flex-start}
.panel{background:var(--zemin);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:0 0 20px}
@media(min-width:760px){.ort{align-items:center}.panel{border-radius:16px}}
.panel .ust{position:sticky;top:0;background:var(--kart);border-bottom:1px solid var(--cizgi);padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:2}
.panel .ust h2{margin:0;font-size:17px;flex:1}
.kapat{border:0;background:var(--gri);border-radius:8px;width:34px;height:34px;font-size:18px;cursor:pointer}
.ic{padding:12px 16px}
table.t{width:100%;border-collapse:collapse;background:var(--kart);border:1px solid var(--cizgi);border-radius:10px;overflow:hidden;font-size:13.5px}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--cizgi);text-align:left;vertical-align:top}
table.t th{background:var(--gri);font-size:12px;color:var(--soluk);font-weight:600}
table.t td.s{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.satirlar{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;background:var(--kart);border:1px solid var(--cizgi);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.satirlar span{color:var(--soluk)}
/* veri girişi */
.ilsec{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.ilsec select{flex:1 1 220px;min-width:0;padding:11px 12px;border:1px solid var(--cizgi);border-radius:10px;background:#fff;font-size:16px}
.uyarit{background:var(--turuncu);border:1px solid #F3C49B;color:#7A3A06;border-radius:10px;padding:9px 12px;margin-bottom:10px;font-size:14px}
.bolum{background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;margin-bottom:10px;overflow:hidden}
.bolum>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:600;display:flex;align-items:center;gap:8px}
.bolum>summary::-webkit-details-marker{display:none}
.bolum>summary::before{content:"▸";color:var(--soluk);transition:transform .15s}
.bolum[open]>summary::before{transform:rotate(90deg)}
.bolum>summary .sag{margin-left:auto;font-weight:400}
.bolum .gov{padding:4px 14px 14px;border-top:1px solid var(--cizgi)}
.alan{margin-top:12px}
.alan>label{display:block;font-size:13px;color:var(--soluk);margin-bottom:5px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--cizgi);background:#fff;border-radius:9px;padding:9px 14px;cursor:pointer;min-width:84px}
.seg button.on{background:var(--lac);border-color:var(--lac);color:#fff}
.seg button.on.kirmizi{background:var(--kirmiziK);border-color:var(--kirmiziK)}
input.g,select.g,textarea.g{width:100%;padding:10px 11px;border:1px solid var(--cizgi);border-radius:9px;background:#FFFDF3;font-size:16px}
input.g:focus,select.g:focus,textarea.g:focus{outline:2px solid var(--lac2);outline-offset:0;background:#fff}
.iki{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.proje{border:1px solid var(--cizgi);border-radius:10px;margin-top:10px;overflow:hidden}
.proje>summary{list-style:none;cursor:pointer;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:start}
.proje>summary::-webkit-details-marker{display:none}
.proje .no{font-weight:700;color:var(--lac2);min-width:26px}
.proje .pad{font-size:14px}
.proje .pad small{display:block;color:var(--soluk);font-size:12px}
.proje .gov{padding:2px 12px 12px;border-top:1px dashed var(--cizgi);background:#FCFCFD}
.kodlar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.kodlar label{font-size:11.5px;color:var(--soluk);display:block;margin-bottom:3px;text-align:center}
.kodlar input{text-align:right;padding:9px 7px}
@media(max-width:560px){.kodlar{grid-template-columns:repeat(2,1fr)}.kodlar>div:last-child{grid-column:1/-1}}
.hesap{margin-top:8px;font-size:13px;color:var(--soluk);display:flex;flex-wrap:wrap;gap:4px 14px}
.hesap b{color:var(--yazi)}
.uy{color:var(--kirmiziK);font-weight:600;font-size:13px;margin-top:6px}
.kaydetbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--kart);border-top:1px solid var(--cizgi);padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:center}
.kaydetbar .durumyazi{font-size:13px;color:var(--soluk);flex:1;max-width:520px}
.btn{border:0;border-radius:10px;padding:12px 22px;font-weight:600;cursor:pointer}
.btn.ana{background:var(--lac);color:#fff}
.btn.ana:disabled{background:#C9B3BE;cursor:default}
.btn.ikincil{background:var(--gri)}
.form{background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;padding:18px;max-width:380px;margin:30px auto}
.form h2{margin:0 0 6px;font-size:18px}
.form p{margin:0 0 14px;color:var(--soluk);font-size:13.5px}
.form .alan:first-of-type{margin-top:0}
.hata{color:var(--kirmiziK);font-size:13.5px;margin-top:10px;min-height:1em}
.ayrac{text-align:center;color:var(--soluk);font-size:12px;margin:16px 0 10px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#1B2333;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;display:none;max-width:90vw}
.yukleniyor{position:fixed;inset:0;background:rgba(244,246,250,.7);z-index:70;display:none;align-items:center;justify-content:center;font-weight:600;color:var(--lac)}
.yukleniyor.acik{display:flex}
.sekmeler{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.sekmeler button{border:1px solid var(--cizgi);background:#fff;border-radius:9px;padding:8px 14px;cursor:pointer}
.sekmeler button.on{background:var(--lac);color:#fff;border-color:var(--lac)}
.kucuk{font-size:12.5px;color:var(--soluk)}
.altkutu{border:1px solid var(--cizgi);border-radius:10px;padding:4px 12px 12px;margin-top:12px;background:#FAFBFD}
.altkutu.yesilkutu{background:#EEF8F0;border-color:#9FD3AA}
.altkutu.mavikutu{background:#F8EEF4;border-color:#D9B3CB}
.altbaslik{font-weight:600;font-size:14px;color:var(--lac);margin-top:8px}
a{color:var(--lac2)}
/* ===== V2: dönem seçici, aşama çubuğu, değerlendirme ekranı, kalan bakiye, toplu işlem ===== */
.donemsec{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:7px 10px;max-width:46vw}
.donemsec option{color:#222}
.demo{background:var(--mercan);color:#fff;text-align:center;font-size:12.5px;padding:5px 10px}
.asama{display:flex;gap:4px;margin:0 0 14px;overflow-x:auto;padding-bottom:2px}
.asama div{flex:1;min-width:max-content;text-align:center;font-size:12px;padding:7px 6px;border-radius:8px;background:#EFE6E1;color:#8A7A74;white-space:nowrap}
.asama div.gecti{background:#F3E1E6;color:var(--lac)}
.asama div.simdi{background:var(--lac);color:#fff;font-weight:600}
.donembas{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:2px 0 10px}
.donembas h2{margin:0;font-size:19px;color:var(--lac)}
.degerlendirme{background:linear-gradient(160deg,#FFF8F2 0%,#FBE9E4 55%,#F4DCE6 100%);border:1px solid #EBCFCB;border-radius:20px;padding:44px 22px 40px;text-align:center;margin-top:6px;position:relative;overflow:hidden}
.degerlendirme svg{width:132px;height:132px;margin-bottom:10px}
.degerlendirme h3{font-size:clamp(24px,5.4vw,40px);letter-spacing:.04em;margin:0 0 14px;color:var(--lac);line-height:1.15}
.degerlendirme p{max-width:560px;margin:6px auto;color:#5A4650;font-size:16px}
.degerlendirme .imza{margin-top:22px;font-size:13px;color:#8A6D78}
.kodsat{border:1px solid var(--cizgi);border-radius:10px;margin-top:10px;background:#fff}
.kodsat .bas{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;font-weight:600;background:#FBF6F3;border-radius:10px 10px 0 0}
.tersat{display:grid;grid-template-columns:1fr 150px 34px;gap:6px;padding:6px 12px;align-items:center;border-top:1px dashed var(--cizgi)}
.tersat input{padding:8px 9px}
.tersat .sil{border:0;background:var(--gri);border-radius:8px;height:34px;cursor:pointer}
@media(max-width:560px){.tersat{grid-template-columns:1fr 34px}.tersat .tut{grid-column:1/2}}
.kodkutu{text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:6px 8px;cursor:pointer}
.kodkutu:hover{border-color:var(--lac2);background:#FBF3F6}
.ekle{border:1px dashed #C9A9B8;background:#fff;color:var(--lac);border-radius:9px;padding:7px 12px;cursor:pointer;margin:8px 12px 10px}
.uyarik{background:#FDF0E6;border:1px solid #F0C9A8;color:#7A3A06;border-radius:8px;padding:6px 10px;font-size:13px;margin-top:6px}
.ilsecliste{max-height:300px;overflow:auto;border:1px solid var(--cizgi);border-radius:10px;background:#fff;padding:4px 10px;margin-top:8px}
.ilsecliste label{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid #F1ECE9}
.ilsecliste label:last-child{border-bottom:0}
.adimlar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.adimlar button{text-align:left;border:1px solid var(--cizgi);background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer}
.adimlar button b{display:block;color:var(--lac)}
.adimlar button.on{border-color:var(--lac);background:#F8EEF4;box-shadow:inset 0 0 0 1px var(--lac)}
.toplubtn{border:1px solid var(--lac);background:#fff;color:var(--lac);border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:600;white-space:nowrap}

@media(min-width:1200px){main{max-width:1360px}.liste{grid-template-columns:repeat(2,1fr)}}

/* ===== V2.2 görsel katman ===== */
.isk .ib{border-radius:12px;background:linear-gradient(100deg,#EFE8E3 30%,#F8F3EF 50%,#EFE8E3 70%);background-size:300% 100%;animation:isk 1.2s linear infinite}
@keyframes isk{from{background-position:120% 0}to{background-position:-60% 0}}
.tazelik{position:fixed;right:12px;bottom:14px;z-index:60;background:#3D2438;color:#fff;font-size:12px;border-radius:99px;padding:6px 12px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
.tazelik.acik{opacity:.92;transform:none}.tazelik.bitti{background:#2E6B43}
.kpi.halkali{position:relative;padding-right:58px}
.halka{position:absolute;right:10px;top:50%;width:42px;height:42px;margin-top:-21px}
.halka circle{fill:none;stroke-width:5}.halka .hz{stroke:#EFE6E1}
.halka .hd{stroke:var(--lac2);stroke-linecap:round;stroke-dasharray:94.25;transform:rotate(-90deg);transform-origin:50% 50%}
.halka text{font-size:11px;font-weight:700;fill:var(--lac)}
.anim .halka .hd{animation:halka .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes halka{from{stroke-dashoffset:94.25}}
.akis{background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.akis-ust{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.akis-ust b{color:var(--lac)}
.akis-cubuk{display:flex;height:22px;border-radius:11px;overflow:hidden;background:#EFE6E1;gap:2px}
.akis-cubuk div{min-width:3px}
.anim .akis-cubuk{animation:akis .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes akis{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.akis-bilgi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px;margin-top:10px;font-size:12.5px}
.akis-bilgi div{display:grid;grid-template-columns:12px 1fr;gap:0 6px;align-items:center}
.akis-bilgi i{width:12px;height:12px;border-radius:3px;grid-row:1/3}
.akis-bilgi span{color:var(--soluk)}.akis-bilgi b{grid-column:2;font-variant-numeric:tabular-nums}
.akis-bilgi em{display:none}.akis-bilgi .sifir{opacity:.45}
.haritakutu summary{cursor:pointer}
.harita{padding:6px 8px 0}
.harita svg{width:100%;height:auto;display:block;max-height:440px}
.harita path{stroke:#fff;stroke-width:1.1;stroke-linejoin:round;cursor:pointer;transition:opacity .25s,filter .15s,fill .5s}
.harita path:hover{filter:brightness(1.12) drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.harita path.pasif{cursor:default}.harita path.sonuk{opacity:.22}
.anim .harita path{animation:ilgel .5s ease-out both}
@keyframes ilgel{from{opacity:0;transform:translateY(6px)}}
.lejant{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px 12px}
.lejant button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--cizgi);background:#fff;border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer}
.lejant button.on{border-color:var(--lac);box-shadow:inset 0 0 0 1px var(--lac)}
.lejant i{width:11px;height:11px;border-radius:3px}
#ipucu{position:fixed;z-index:70;display:none;background:#2B1A28;color:#fff;font-size:12.5px;line-height:1.35;border-radius:8px;padding:7px 10px;pointer-events:none;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#ipucu span{opacity:.8}
.adim{grid-column:1/-1;display:flex;align-items:center;gap:4px;margin-top:4px}
.adim i{width:18px;height:5px;border-radius:3px;background:#EAE1DB}
.adim i.dolu{background:var(--lac2)}.adim i.son{background:var(--lac)}
.adim span{font-size:11.5px;color:var(--soluk);margin-left:6px}
.anim .ilkart{animation:kartgel .35s ease-out both}
@keyframes kartgel{from{opacity:0;transform:translateY(8px)}}
.anim .kpi{animation:kartgel .4s ease-out both}
#onayk{position:fixed;inset:0;z-index:80;background:rgba(27,35,51,.45);display:none;align-items:center;justify-content:center;padding:16px}
#onayk.acik{display:flex}
#onayk .ok{background:#fff;border-radius:16px;width:100%;max-width:440px;box-shadow:0 12px 40px rgba(15,23,42,.35);overflow:hidden;animation:okGir .16s ease-out}
@keyframes okGir{from{transform:translateY(10px) scale(.97);opacity:0}to{transform:none;opacity:1}}
#onayk .okb{padding:14px 18px;border-bottom:1px solid var(--cizgi);font-weight:700;font-size:16.5px;display:flex;gap:10px;align-items:center}
#onayk .okb i{width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:var(--turuncu);color:var(--mercan);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800}
#onayk .oki{padding:14px 18px;font-size:15px;line-height:1.5;white-space:pre-line}
#onayk .oka{padding:0 18px 16px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
#onayk .oka .btn{background:var(--gri);color:var(--yazi)}#onayk .oka .btn.ana{background:var(--lac);color:#fff}

document.addEventListener('pointerdown',e=>{ sonY=e.pageY; },true);
function uzunMu(){ let g=false; try{ g = window.self!==window.top; }catch(e){ g=true; } return g && innerHeight > (screen.availHeight||900)*0.95; }
function uzunAyarla(){ document.body.classList.toggle('uzun', uzunMu()); }
window.addEventListener('resize', uzunAyarla);
function gorunurY(ek){ return Math.max(10, sonY-(ek||160)); }
function panelAc(){
  const o=$('ort'), p=$('panel'); uzunAyarla(); o.classList.add('acik');
  if(document.body.classList.contains('uzun')){ const ust=gorunurY(90); p.style.marginTop=ust+'px'; o.style.minHeight=Math.max(document.documentElement.scrollHeight, ust+700)+'px'; p.scrollTop=0; setTimeout(()=>{ try{ p.scrollIntoView({block:'nearest',behavior:'smooth'}); }catch(e){} },30); }
  else { p.style.marginTop=''; o.style.minHeight=''; }
}
function toast(m,sn){ const t=$('toast'); t.textContent=m; t.style.display='block'; t.style.top = document.body.classList.contains('uzun') ? (gorunurY(40))+'px' : ''; clearTimeout(t._z); t._z=setTimeout(()=>t.style.display='none',sn||3500); }
function yuk(a,m){ $('yuk').classList.toggle('acik',!!a); $('yuk').style.paddingTop = document.body.classList.contains('uzun') ? gorunurY(40)+'px' : ''; if(m) $('yukyazi').textContent=m; }
const API_URL='https://script.google.com/macros/s/AKfycbwOADgd-BsUI4PYs77Lvb08fS8QRezzA3cAVAmckcFuRJlONKeWN-puXErivBdsSfMi/exec'; // V2 Apps Script yayın adresi kurulumdan sonra yazılır (eski v13 adresi BURADA KULLANILMAZ)
function cagir(fn,args,ok,hata){
  if(window.SAHTE){ setTimeout(()=>{ let c; try{ c={ok:true,veri:JSON.parse(JSON.stringify(window.SAHTE.cagir(fn,args||[])))}; }catch(e){ c={ok:false,hata:String(e&&e.message||e)}; }
    if(c.ok) ok&&ok(c.veri); else { yuk(false); const m=c.hata; if(m.indexOf('OTURUM:')>=0){ oturumBitir(); toast('Oturum süresi doldu, yeniden giriş yapın.'); return; } (hata||(x=>toast('Hata: '+x)))(m); } },120); return; }
  const hataYap=e=>{
    yuk(false);
    const m=String(e&&e.message||e);
    if(m.indexOf('OTURUM:')>=0){ oturumBitir(); toast('Oturum süresi doldu, yeniden giriş yapın.'); return; }
    (hata||(x=>toast('Hata: '+x)))(m);
  };
  if(window.google&&google.script&&google.script.run){ google.script.run.withSuccessHandler(v=>{ ok&&ok(v); }).withFailureHandler(hataYap)[fn].apply(null,args||[]); return; }
  fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args||[]})})
    .then(r=>r.json()).then(c=>{ if(c.ok) ok&&ok(c.veri); else hataYap(c.hata); })
    .catch(e=>hataYap('Bağlantı kurulamadı ('+(e&&e.message||e)+')'));
}

  cagir('veriGetir',[d],v=>{
    if(S.donem!==d) return;
    S.veri=v; saklaYaz('veri_'+d,v);
    if(!onb){ bitir(); return; }
    tazelik('✓ Güncel',true);
    if(S.gorunum==='veri'&&S.il){ if(!S.degisti){ v.tur==='KALAN'?kalanIlSec(S.il):ilSec(S.il); } return; }

  if(i.kismi) return 'Kısmen aktarıldı';

  if(dk(d)==='3'){ const a=dk(i.aktDurum); return a==='3' ? 'Hazine sürecinde – Genel Müdürlükten çıktı' : (a==='2' ? 'Yönetimden aktarım bekleniyor' : 'Yönetime iletilmeli'); }

/* Excel formüllerinin aynısı — anında geri bildirim için (asıl hesap tabloda yapılır) */
function hesapla(){
  const t=S.taslak; if(!t) return;
  const ps=t.projeler, i=t.il;
  let talep=0, hatali=false, kod=[0,0,0,0,0], harc=0, kalan=0, kap=0, talepli=0;
  const top=p=>{ const v=p.k.filter(x=>x!==''&&!isNaN(x)); return v.length? v.reduce((s,x)=>s+x,0) : ''; };
  const ilTalepVar = ps.some(p=>top(p)!=='' && top(p)>0);
  ps.forEach((p,ix)=>{
    const tp=top(p); if(p.k.some(x=>Number.isNaN(x))) hatali=true;
    p.k.forEach((x,j)=>{ if(x!==''&&!isNaN(x)) kod[j]+=x; });
    if(tp!=='') { talep+=tp; if(tp>0) talepli++; }
    const u1 = tp==='' ? (ilTalepVar&&!p.aciklama?'Talep yok: açıklama yazın':'') : (tp>p.ust?'Üst sınır aşıldı':'');
    const e=$('pt'+ix); if(e) e.textContent = tp===''?'':tl0(tp);
    const hh=$('ph'+ix); if(hh) hh.innerHTML = tp===''?'':'Toplam <b>'+tl(tp)+'</b> · üst sınırın <b>'+yz(tp/p.ust)+'</b>';
    const uu=$('pu'+ix); if(uu) uu.textContent = (p.k.some(x=>Number.isNaN(x))?'Tutar anlaşılamadı (yalnız rakam). ':'')+u1;
    // EK-2
    const h=p.harcanan; if(Number.isNaN(h)) hatali=true;
    const hn=(h===''||isNaN(h))?0:h, tn=tp===''?0:tp;
    let kl=''; if(p.durum){ kl = p.durum==='İptal edildi'? tn : tn-hn; kalan+=kl; kap++; }
    harc+=hn;
    let u2=''; if(!p.durum){ if(hn>0) u2='Durum seçilmedi'; }
    else if(p.durum==='İptal edildi'&&hn>0) u2='İptalde harcama olmaz';
    else if(h==='') { if(p.durum==='Gerçekleştirildi') u2='Harcanan yazılmadı'; }
    else if(hn>tn) u2='Harcanan talepten fazla';
    const a=$('p2a'+ix); if(a) a.textContent='Talep '+(tp===''?'yok':tl0(tp))+(p.durum?' · '+p.durum:'');
    const k=$('p2k'+ix); if(k) k.textContent = p.durum? 'Kalan '+tl0(kl):'';
    const u=$('p2u'+ix); if(u) u.textContent=(Number.isNaN(h)?'Tutar anlaşılamadı (yalnız rakam). ':'')+u2;
  });
  const aktarildi = !!i.nTarih;
  const aktarilan = aktarildi? talep : 0;
  const akt = aktarildi?'4 · Nakit aktarıldı': i.aTarih?'3 · Hazine sürecinde – Genel Müdürlükten çıktı': (i.yonetime==='Evet'?'2 · Yönetimden aktarım bekleniyor':(i.resmi==='Geldi'?'1 · Yönetime iletilmeli':''));
  const elindeki = gli()? ((S.veri.iller.find(x=>x.il===S.il)||{}).elindeki||0) : aktarilan-harc;
  const eksik=[]; kod.forEach((x,j)=>{ const d=$('ter'+j); if(d) d.style.display = x>0?'block':'none'; if(x>0 && !String(i['t'+(j+1)]||'').trim()) eksik.push(j<4?KOD[j]:'DİĞER'); });
  if(kod[4]>0 && !String(i.digerKod||'').trim()) eksik.push('DİĞER kodu');
  const tu=$('teruy'); if(tu) tu.textContent = eksik.length? 'Tertip eksik: '+eksik.join(', ') : '';
  const o1=$('ozet1'); if(o1) o1.textContent='Talep '+tl0(talep);
  const o2=$('ozet2'); if(o2) o2.innerHTML= akt?'<span class="rozet a'+dk(akt)+'">'+esc(akt.slice(4))+'</span>':'';
  const o3=$('ozet3'); if(o3) o3.textContent=kap+'/'+talepli+' proje kapandı';
  const h2=$('hesap2'); if(h2) h2.innerHTML='Aktarılan: <b class="para">'+tl(aktarilan)+'</b>'+(i.yonetime==='Evet'&&(!i.yTarih||!i.ySayi)?' · <span class="uy">Yönetime yazının tarih/sayısı eksik</span>':'')+
      ((i.aTarih&&!i.aSayi)?' · <span class="uy">Aktarım yazısının sayısı eksik</span>':'')+
      ((!!i.hTarih!==!!String(i.hNo||'').trim())?' · <span class="uy">Ödeme emri tarihi ve numarası birlikte girilmeli</span>':'')+
      ((i.hTarih&&!i.aTarih)?' · <span class="uy">Önce 2b aktarım yazısını girin</span>':'')+
      ((i.nTarih&&!(i.hTarih&&String(i.hNo||'').trim()))?' · <span class="uy">Ödeme emri tarihi ve numarası da girilmeli</span>':'');
  const h3=$('hesap3'); if(h3) h3.innerHTML='Harcanan <b class="para">'+tl(harc)+'</b> · Kalan (kapanan projeler) <b class="para">'+tl(kalan)+'</b>';
  const h4=$('hesap4'); if(h4) h4.innerHTML='İlin elindeki kalan tutar <b class="para">'+tl(elindeki)+'</b><div class="kucuk">Aktarılan − harcanan (iptal edilen projenin parası ilde kalır)</div>';
  const o4=$('ozet4'); if(o4) o4.textContent= i.kDurum? i.kDurum : (elindeki>0.005? tl0(elindeki) : '');
  const oT=$('ozetT'); if(oT) oT.textContent= eksik.length? 'eksik: '+eksik.join(', ') : (kod.some(x=>x>0)?'tamam':'');
  t.hatali=hatali;
  $('kaydetyazi').textContent = hatali? 'Hatalı tutar var, düzeltin.' : (S.degisti? 'Kaydedilmemiş değişiklik var.' : 'Değişiklik yok.');
  $('kaydetBtn').disabled = hatali || !S.degisti;
}

  const o=S.veri.iller.find(x=>x.il===ad);

    il:{resmi:o.resmi,kontrol:o.kontrol,yonetime:o.yonetime,yTarih:o.yTarih,ySayi:String(o.ySayi||''),aTarih:o.aTarih,aSayi:String(o.aSayi||''),hTarih:o.hTarih||'',hNo:String(o.hNo||''),nTarih:o.nTarih||'',rTarih:o.rTarih||'',rSayi:String(o.rSayi||''),ek2:o.ek2,kDurum:o.kDurum,kAciklama:o.kAciklama,not:o.not,t1:o.t[0],t2:o.t[1],t3:o.t[2],t4:o.t[3],t5:o.t[4],digerKod:o.digerKod},
    projeler:S.veri.projeler.filter(p=>p.il===ad).map(p=>({r:p.r,sn:p.sn,ad:p.ad,tur:p.tur,ust:p.ust,k:p.k.slice(),aciklama:p.aciklama,durum:p.durum,harcanan:p.harcanan,aciklama2:p.aciklama2})) };

function kaydet(zorla){
  if(S.veri&&S.veri.tur==='KALAN') return kalanKaydet(zorla);
  const t=S.taslak; if(!t||t.hatali) return;
  const veri={ il:t.il, projeler:t.projeler.map(p=>({r:p.r,k:p.k,aciklama:p.aciklama,durum:p.durum,harcanan:p.harcanan,aciklama2:p.aciklama2})) };
  yuk(true,'Kaydediliyor ve Excel güncelleniyor…');
  cagir('kaydet',[S.oturum.token,S.donem,S.il,veri,t.taban,!!zorla],r=>{
    yuk(false);
    if(!r.ok){
      if(r.cakisma){ onayKutusu(r.mesaj,'Evet, yine de kaydet',()=>kaydet(true),'Başka biri değiştirdi'); return; }
      toast(r.mesaj||'Kaydedilemedi.'); return;
    }
    const ac={ac1:t.ac1,acT:t.acT,ac2:t.ac2,ac3:t.ac3,ac4:t.ac4,acN:t.acN};
    S.veri=r.veri; S.degisti=false; S.taslak=Object.assign(taslakKur(S.il),ac);
    ciz();
    if(r.degisiklikYok) toast('Değişiklik yoktu.');
    else tik('Kaydedildi');
    if(!r.degisiklikYok) toast(r.excel&&r.excel.ok ? '✓ Kaydedildi. Excel güncellendi.' : '✓ Kaydedildi. Excel güncellenemedi: '+(r.excel&&r.excel.mesaj||''), 5000);
  });
}

/* ===================== EK-1 EXCEL'LERİNİ YÜKLE (20.11.2026 · Ahmet: Tuba ve Muazzez de kullanır; tutarı olan ilde eski/yeni gösterilip onay istenir) =====================
   İllerin doldurduğu ÜNİDES EK-1 formu (sayfa "EK-1 TALEP") tarayıcıda okunur; dosya hiçbir yere yüklenmez.
   Eşleşme: B3 il adı + S.N. (il sıra no) → sistemdeki proje; proje adı karşılaştırılır. Kaydetme mevcut "kaydet" ile, il il yapılır. */
const E1={dosyalar:[]};
const e1Ust=s=>String(s==null?'':s).toLocaleUpperCase('tr-TR').replace(/\s+/g,' ').trim();
const e1Ad=s=>e1Ust(s).replace(/[^0-9A-ZÇĞİÖŞÜ]+/g,'');
function e1Sayi(v){
  if(v===''||v==null) return '';
  if(typeof v==='number') return isFinite(v)?Math.round(v*100)/100:'';
  let s=String(v).replace(/[\s₺]|TL/gi,''); if(!s) return '';
  if(s.indexOf(',')>=0) s=s.replace(/\./g,'').replace(',','.');
  const n=Number(s); return isFinite(n)?Math.round(n*100)/100:NaN;
}
const e1Top=k=>Math.round(k.reduce((s,x)=>s+(Number(x)||0),0)*100)/100;
const e1Esit=(a,b)=>Math.abs((Number(a)||0)-(Number(b)||0))<0.005;
function e1Kutuphane(sonra){
  if(window.XLSX) return sonra();
  const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload=sonra; s.onerror=()=>{ yuk(false); toast('Excel okuyucu yüklenemedi. İnternet bağlantısını kontrol edin.'); }; document.head.appendChild(s);
}
function e1Ac(){
  if(S.degisti){ toast('Önce açık ildeki değişiklikleri kaydedin.'); return; }
  E1.dosyalar=[]; E1.taban=0; e1Ciz(); panelAc();
}
function e1Ciz(){
  const d=E1.dosyalar, sec=d.filter(x=>x.sec), yeniIl=sec.filter(x=>x.tip==='yeni').length, degIl=sec.filter(x=>x.tip==='degisik').length;
  let h='<div class="ust"><h2>📥 EK-1 Excel\'lerini yükle · '+esc(D().ad)+'</h2><button class="kapat" onclick="panelKapat()">×</button></div><div class="ic">'+
    '<p class="kucuk" style="margin-top:0">İllerin gönderdiği EK-1 nakit talep formlarını seçin (birden fazla seçilebilir). Proje tutarları il ve S.N.\'ye göre eşleştirilir; kaydetmeden önce kontrol listesi gösterilir. Dosyalar yalnız bu bilgisayarda okunur, hiçbir yere yüklenmez. Resmî yazı ve kontrol alanları değişmez.</p>'+
    '<label class="btn ana" style="display:block;text-align:center;margin:8px 0 12px;cursor:pointer">📂 Excel dosyalarını seç<input id="e1dosya" type="file" accept=".xlsx,.xls,.xlsm" multiple style="display:none" onchange="e1Oku(this.files)"></label>';
  if(d.length){
    h+='<div class="satirlar">'+sat('Okunan dosya',String(d.length))+sat('Aktarılacak',sec.length+' il ('+yeniIl+' yeni, '+degIl+' önceki tutarın üzerine)')+sat('Aktarılacak talep toplamı','<b>'+tl(sec.reduce((s,x)=>s+x.toplam,0))+'</b>',true)+'</div>';
    h+=d.map((x,ix)=>e1Kart(x,ix)).join('');
    h+='<button class="btn ana" style="width:100%;margin:12px 0" '+(sec.length?'':'disabled ')+'onclick="e1Aktar()">✓ Seçilenleri aktar ('+sec.length+' il)</button>';
  }
  h+='</div>'; $('panel').innerHTML=h;
}
function e1Kart(x,ix){
  const renk={hata:'#FBE3E3',ayni:'#EEF0F2',degisik:'#FFF4D6',yeni:'#E4F1E8'}[x.tip], etiket={hata:'Aktarılamaz',ayni:'Sistemdekiyle aynı – işlem gerekmez',degisik:'Önceki tutarlar var – eski / yeni karşılaştırın',yeni:'Yeni talep'}[x.tip];
  let h='<div style="border:1px solid var(--cizgi);border-radius:12px;padding:10px 12px;margin:8px 0;background:'+renk+'">'+
    '<label style="display:flex;gap:8px;align-items:flex-start;cursor:'+(x.secilebilir?'pointer':'default')+'"><input type="checkbox" style="margin-top:4px;width:18px;height:18px" '+(x.sec?'checked ':'')+(x.secilebilir?'':'disabled ')+'onchange="E1.dosyalar['+ix+'].sec=this.checked;e1Ciz()">'+
    '<div style="flex:1;min-width:0"><b>'+esc(x.il||'İl okunamadı')+'</b> · <span class="kucuk">'+esc(x.dosya)+'</span><br><span class="kucuk">'+esc(etiket)+'</span>'+
    (x.tip!=='hata'?'<div class="kucuk" style="margin-top:4px">'+x.eslesen+'/'+x.sistemProje+' proje eşleşti · Formdaki talep <b class="para">'+tl(x.toplam)+'</b>'+(x.tip==='degisik'?' · Sistemdeki <span class="para">'+tl(x.eskiToplam)+'</span> · '+x.degisen.length+' projede değişiklik':'')+'</div>':'')+'</div></label>';

  if(x.uyarilar.length) h+='<div style="color:#8A5A00;margin-top:6px">'+x.uyarilar.map(m=>'⚠ '+esc(m)).join('<br>')+'</div>';
  if(x.tip==='degisik'||x.tip==='yeni'){
    const l=x.tip==='degisik'?x.degisen:x.satirlar.filter(s=>s.p);
    h+='<details style="margin-top:6px"'+(x.tip==='degisik'?' open':'')+'><summary class="kucuk" style="cursor:pointer">'+(x.tip==='degisik'?'Eski / yeni tutarlar':'Proje tutarları')+' ('+l.length+')</summary><div style="overflow-x:auto"><table class="t" style="min-width:560px"><thead><tr><th>S.N.</th><th>Proje</th>'+
      KKOD.map(k=>'<th style="text-align:right">'+k+'</th>').join('')+'<th style="text-align:right">Toplam</th></tr></thead><tbody>'+
      l.map(s=>{ const p=s.p, es=x.tip==='degisik';
        const hucre=(j)=>{ const y=s.k[j], e=p.k[j]; const fark=es&&!e1Esit(y,e); return '<td class="s"'+(fark?' style="background:#FFE7A3"':'')+'>'+(fark?'<s class="kucuk">'+(e===''||e==null?'—':tl(e))+'</s><br>':'')+(y===''?'—':tl(y))+'</td>'; };
        return '<tr><td>'+esc(String(s.sn))+'</td><td style="max-width:220px">'+esc(p.ad)+'</td>'+[0,1,2,3,4].map(hucre).join('')+'<td class="s"><b>'+tl(e1Top(s.k))+'</b>'+(es&&!e1Esit(e1Top(s.k),e1Top(p.k))?'<br><s class="kucuk">'+tl(e1Top(p.k))+'</s>':'')+'</td></tr>'; }).join('')+
      '</tbody></table></div></details>';
  }
  return h+'</div>';
}
function e1Oku(fl){
  const l=[...(fl||[])]; if(!l.length) return;
  yuk(true,'Excel dosyaları okunuyor…');
  e1Kutuphane(()=>{
    let kalan=l.length; const sonuc=[];
    l.forEach((f,ix)=>{ const r=new FileReader();
      r.onload=e=>{ let x; try{ x=e1Coz(f.name,new Uint8Array(e.target.result)); }catch(err){ x={dosya:f.name,il:'',hatalar:['Dosya okunamadı: '+(err&&err.message||err)],uyarilar:[],tip:'hata'}; } sonuc[ix]=x; if(--kalan===0) e1Bitir(sonuc); };
      r.onerror=()=>{ sonuc[ix]={dosya:f.name,il:'',hatalar:['Dosya açılamadı'],uyarilar:[],tip:'hata'}; if(--kalan===0) e1Bitir(sonuc); };
      r.readAsArrayBuffer(f); });
  });
}
function e1Bitir(yeni){
  yuk(false); if(!E1.taban) E1.taban=S.veri.zaman;
  const hepsi=E1.dosyalar.concat(yeni), gor={};
  hepsi.forEach(x=>{ if(x.tip==='hata'||!x.il) return; if(gor[x.il]){ x.tip='hata'; x.hatalar.push('Bu il için birden fazla dosya seçildi ('+gor[x.il]+'). Yalnız birini seçin.'); } else gor[x.il]=x.dosya; });
  hepsi.forEach(x=>{ x.secilebilir=x.tip==='yeni'||x.tip==='degisik'; if(!x.secilebilir) x.sec=false; else if(x.sec===undefined) x.sec=x.tip==='yeni'&&!x.uyarilar.length; });
  hepsi.sort((a,b)=>({hata:0,degisik:1,yeni:2,ayni:3}[a.tip]-{hata:0,degisik:1,yeni:2,ayni:3}[b.tip])||String(a.il).localeCompare(String(b.il),'tr'));
  E1.dosyalar=hepsi; e1Ciz();
  const n=yeni.length, h=yeni.filter(x=>x.tip==='hata').length; toast(n+' dosya okundu'+(h?', '+h+' dosya aktarılamaz (kırmızı)':'')+'.');
}
function e1Coz(ad,veri){
  const x={dosya:ad,il:'',hatalar:[],uyarilar:[],satirlar:[],degisen:[],toplam:0,eskiToplam:0,eslesen:0,sistemProje:0,tip:'hata'};
  const wb=XLSX.read(veri,{type:'array'});
  const sn=wb.SheetNames.find(n=>e1Ust(n)==='EK-1 TALEP')||wb.SheetNames.find(n=>e1Ust(n).indexOf('EK-1')>=0);
  if(!sn){ x.hatalar.push('"EK-1 TALEP" sayfası yok — ÜNİDES EK-1 formu değil.'); return x; }
  const R=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''}), H=i=>e1Ust((R[i]||[])[0]);
  // il ve form kontrolü
  const ilS=R.findIndex((r,i)=>i<15&&H(i)==='İL');
  if(ilS<0){ x.hatalar.push('İl hücresi (B3) bulunamadı.'); return x; }
  const ilAd=e1Ust(R[ilS][1]); x.il=ilAd;
  if(!ilAd){ x.hatalar.push('Formda il seçilmemiş (B3 boş).'); return x; }
  const sil=S.veri.iller.find(i=>e1Ust(i.il)===ilAd);
  if(!sil){ x.hatalar.push('"'+ilAd+'" bu dönemin il listesinde yok.'); return x; }
  x.il=sil.il;
  const kj=R[ilS].findIndex(v=>e1Ust(v)==='KONTROL'); let kontrol=''; if(kj>=0) for(let j=kj+1;j<R[ilS].length;j++){ if(String(R[ilS][j]).trim()){ kontrol=String(R[ilS][j]).trim(); break; } }
  if(kontrol&&e1Ust(kontrol)!=='UYARI YOK') x.uyarilar.push('Formun kendi kontrolü: "'+kontrol+'"');
  const par=wb.SheetNames.find(n=>e1Ust(n)==='PARAMETRE');
  if(par){ const P=XLSX.utils.sheet_to_json(wb.Sheets[par],{header:1,raw:true,defval:''}), sur=(P.find(r=>e1Ust(r[0]).indexOf('SÜREÇ')===0)||[])[1];
    if(sur&&e1Ad(sur)!==e1Ad(D().ad)) x.uyarilar.push('Form "'+sur+'" için hazırlanmış; açık dönem '+D().ad+'.'); }
  // başlık satırı ve sütunlar
  const bs=R.findIndex(r=>e1Ust(r[0])==='S.N.');
  if(bs<0){ x.hatalar.push('Proje tablosunun başlığı (S.N.) bulunamadı.'); return x; }
  const B=R[bs].map(e1Ust), sut=t=>B.findIndex(v=>v===t), basla=t=>B.findIndex(v=>v.indexOf(t)===0);
  const kc=['03.02','03.03','03.05','06.01','DİĞER'].map(sut), adc=basla('PROJE ADI'), acc=basla('AÇIKLAMA');
  if(kc.some(c=>c<0)||adc<0){ x.hatalar.push('Ekonomik kod sütunları (03.02 … DİĞER) beklenen yerde değil.'); return x; }
  const digerKod=String((R[bs+1]||[])[kc[4]]||'').trim();
  // satırlar
  const proj=S.veri.projeler.filter(p=>p.il===sil.il); x.sistemProje=proj.length;
  for(let i=bs+1;i<R.length;i++){
    const r=R[i], s=r[0]; if(s===''||isNaN(Number(s))) continue;
    const k=kc.map(c=>e1Sayi(r[c]));
    if(k.some(v=>Number.isNaN(v))){ x.hatalar.push('S.N. '+s+': tutar sayı değil ('+kc.map(c=>r[c]).filter(v=>v!=='').join(' / ')+')'); continue; }
    if(k.some(v=>v!==''&&v<0)){ x.hatalar.push('S.N. '+s+': eksi tutar'); continue; }
    const p=proj.find(q=>Number(q.sn)===Number(s));
    const satir={sn:Number(s),ad:String(r[adc]||'').trim(),k,aciklama:acc>=0?String(r[acc]||'').trim():'',p};
    if(!p){ x.hatalar.push('S.N. '+s+' ('+satir.ad+') sistemde bu ilde yok.'); continue; }
    if(e1Ad(satir.ad)&&e1Ad(satir.ad)!==e1Ad(p.ad)) x.uyarilar.push('S.N. '+s+': proje adı farklı — formda "'+satir.ad+'", sistemde "'+p.ad+'"');
    const top=e1Top(k); if(p.ust&&top>p.ust+0.004) x.uyarilar.push('S.N. '+s+': talep '+tl(top)+' üst sınırı ('+tl(p.ust)+') aşıyor');
    if(!(top>0)&&!satir.aciklama) x.uyarilar.push('S.N. '+s+': talep yok ve açıklama yazılmamış');
    x.satirlar.push(satir);
  }
  if(!x.satirlar.length&&!x.hatalar.length) x.hatalar.push('Formda proje satırı okunamadı. Dosya Excel dışında bir programla kaydedildiyse Excel\'de açıp yeniden kaydedin, sonra tekrar seçin.');
  const gorulen=new Set(x.satirlar.map(s=>s.sn)), eksik=proj.filter(p=>!gorulen.has(Number(p.sn)));
  if(eksik.length) x.uyarilar.push(eksik.length+' proje formda yok (S.N. '+eksik.map(p=>p.sn).join(', ')+') — bunlara dokunulmaz');
  const ciftler=x.satirlar.filter((s,i,a)=>a.findIndex(t=>t.sn===s.sn)!==i); if(ciftler.length) x.hatalar.push('Aynı S.N. iki kez: '+ciftler.map(s=>s.sn).join(', '));
  if(x.hatalar.length) return x;
  x.eslesen=x.satirlar.length; x.toplam=e1Top(x.satirlar.map(s=>e1Top(s.k)));
  x.eskiToplam=e1Top(proj.map(p=>e1Top(p.k)));
  x.digerKod=e1Top(x.satirlar.map(s=>Number(s.k[4])||0))>0&&/^\d{2}\.\d{2}/.test(digerKod)?digerKod:'';
  if(e1Top(x.satirlar.map(s=>Number(s.k[4])||0))>0&&!x.digerKod) x.uyarilar.push('DİĞER sütununda tutar var ama ekonomik kodu (J8) yazılmamış');
  const kDeg=s=>s.k.some((v,j)=>!e1Esit(v,s.p.k[j]))||(s.aciklama&&s.aciklama!==String(s.p.aciklama||''));
  const doluydu=proj.some(p=>p.k.some(v=>v!==''&&v!=null&&Number(v)!==0));
  x.degisen=x.satirlar.filter(kDeg);
  const digerDeg=x.digerKod&&x.digerKod!==String(sil.digerKod||'').trim();
  x.tip=!x.degisen.length&&!digerDeg?'ayni':(doluydu?'degisik':'yeni');
  if(x.tip==='degisik'&&digerDeg&&sil.digerKod) x.uyarilar.push('DİĞER kodu değişiyor: '+sil.digerKod+' → '+x.digerKod);
  return x;
}
function e1Aktar(){
  const l=E1.dosyalar.filter(x=>x.sec); if(!l.length) return;
  const deg=l.filter(x=>x.tip==='degisik');
  onayKutusu(l.length+' ilin EK-1 tutarları kaydedilecek ('+l.map(x=>x.il).join(', ')+').'+(deg.length?'\n\n'+deg.length+' ilde ('+deg.map(x=>x.il).join(', ')+') sistemdeki önceki tutarların üzerine yazılacak.':'')+'\n\nHer il ayrı kaydedilir ve Excel güncellenir; il başına birkaç saniye sürer.','Evet, aktar',()=>e1Sira(l,0,[]),'EK-1 aktarımı');
}
function e1Sira(l,n,sonuc){
  if(n>=l.length) return e1Son(sonuc);
  const x=l[n], o=S.veri.iller.find(i=>i.il===x.il);
  yuk(true,'Aktarılıyor '+(n+1)+'/'+l.length+': '+x.il+'…');
  const byR={}; S.veri.projeler.filter(p=>p.il===x.il).forEach(p=>byR[p.r]=p);
  const projeler=x.satirlar.map(s=>{ const p=byR[s.p.r]||s.p; return {r:p.r,k:s.k,aciklama:s.aciklama||p.aciklama||'',durum:p.durum,harcanan:p.harcanan,aciklama2:p.aciklama2}; });
  const veri={il:x.digerKod&&x.digerKod!==String(o.digerKod||'').trim()?{digerKod:x.digerKod}:{},projeler};
  cagir('kaydet',[S.oturum.token,S.donem,x.il,veri,E1.taban||S.veri.zaman,false],r=>{
    if(r.ok){ S.veri=r.veri; x.sec=false; x.tip='ayni'; x.secilebilir=false; sonuc.push([x.il,true,r.degisiklikYok?'değişiklik yoktu':'kaydedildi'+(r.excel&&r.excel.ok===false?' (Excel güncellenemedi)':'')]); }
    else sonuc.push([x.il,false,r.cakisma?'siz dosyayı okurken başka biri bu ili değiştirdi — dosyayı yeniden okuyun':(r.mesaj||'kaydedilemedi')]);
    e1Sira(l,n+1,sonuc);
  },m=>{ sonuc.push([x.il,false,m]); e1Sira(l,n+1,sonuc); });
}
function e1Son(sonuc){
  yuk(false);
  if(S.il) S.taslak=taslakKur(S.il);
  const iyi=sonuc.filter(s=>s[1]), kotu=sonuc.filter(s=>!s[1]);
  ciz(); e1Ciz(); panelAc();
  onayKutusu(iyi.length+' il aktarıldı'+(iyi.length?': '+iyi.map(s=>s[0]).join(', '):'')+'.'+(kotu.length?'\n\nAktarılamayan '+kotu.length+' il:\n'+kotu.map(s=>'• '+s[0]+': '+s[2]).join('\n'):''),'Tamam',null,kotu.length?'Aktarım tamamlandı (sorunlu iller var)':'Aktarım tamamlandı');
}
/* ===================== ÖDENEK AKTARMA TABLOSU ===================== */
const SECIMLER=[['iletilecek','Yönetime iletilecekler','1'],['bekleyen','Yönetimden aktarım bekleyenler','2'],['hazine','Hazine sürecindekiler','3'],['aktarilan','Nakdi aktarılanlar','4'],['hepsi','Talebi gelen tüm iller',''],['secili','İl seçerek','']];
S.od={secim:'iletilecek',haric:true,iller:[]};
function odSuz(){
  const s=S.od, l=S.veri.iller.filter(i=>i.talep>0);
  return l.filter(i=>{
    if(s.secim==='secili' && s.iller.indexOf(i.il)<0) return false;
    if(['iletilecek','bekleyen','hazine','aktarilan'].indexOf(s.secim)>=0){ const k=SECIMLER.find(x=>x[0]===s.secim)[2]; if(String(i.aktDurum).charAt(0)!==k) return false; }
    if(s.haric && String(i.durum).charAt(0)==='2') return false;
    return true; });
}
function odenekAc(){
  const s=S.od, l=odSuz(), tum=S.veri.iller.filter(i=>i.talep>0);
  const kalem=l.reduce((n,i)=>n+i.kod.filter(x=>x>0).length,0), top=l.reduce((n,i)=>n+i.talep,0);
  let h='<div class="ust"><h2>Ödenek aktarma tablosu</h2><button class="kapat" onclick="panelKapat()">×</button></div><div class="ic">'+
    '<div class="alan" style="margin-top:0"><label>Tabloya girecek iller</label><div class="seg">'+
    SECIMLER.map(x=>'<button type="button" class="'+(s.secim===x[0]?'on':'')+'" onclick="S.od.secim=\''+x[0]+'\';odenekAc()">'+esc(x[1])+'</button>').join('')+'</div></div>'+

/* Eksi kalan varsa: otomatik dağıtım gösterilir; istenirse elle dağıtılır (toplam = max(0, il toplamı)). Kaydedince onay düşer. */
function kodToplamlari(){ const t=S.taslak, o={}; KKOD.forEach(k=>{ let s=0; t.kod[k].forEach(x=>{ if(x.tutar!==''&&!Number.isNaN(x.tutar)) s+=x.tutar; }); o[k]=Math.round(s*100)/100; }); return o; }
function netOto(kt){ const ks=KKOD.filter(k=>kt[k]); const m={}; ks.forEach(k=>m[k]=Math.max(0,kt[k]));
  const top=ks.reduce((s,k)=>s+kt[k],0); let neg=-ks.filter(k=>kt[k]<0).reduce((s,k)=>s+kt[k],0);
  if(top<=0){ ks.forEach(k=>m[k]=0); return m; }
  ks.filter(k=>kt[k]>0).sort((a,b)=>kt[b]-kt[a]).forEach(k=>{ const d=Math.min(neg,m[k]); m[k]=Math.round((m[k]-d)*100)/100; neg=Math.round((neg-d)*100)/100; });
  return m; }

/* ===================== V2.3 · 7. DÖNEM VE SONRASI: KALAN DÜŞME (MAHSUP) + KISMİ GÖNDERİM (19.11.2026 kararları) =====================
   Yazar: AHMET KÜÇÜKYAĞCI. Sunucu her il için şunları verir (S.veri.gonderimli=true olan dönemlerde):
   i.m = {talep[5], dus{'5':[5],'6':[5]}, dusToplam[5], net[5], netToplam, dusulen, devreden{}, uyarilar[], notlar[]}
   i.gonderimler=[{no,kod[5],toplam,asama,asamaAd,yTarih,ySayi,aTarih,aSayi,hTarih,hNo,nTarih}], i.net, i.gonderilen, i.planlanan,
   i.yolda (planlanıp nakdi gelmeyen), i.planlanmamis, i.bekleyen (= net − gönderilen), i.kodBekleyen[5], i.kodPlanlanmamis[5], i.kismi */
const GKOD=['03.02','03.03','03.05','06.01','DİĞER'];
function gli(){ return !!(S.veri&&S.veri.gonderimli); }
function kaynakAd(){ return (S.veri.kaynaklar||[]).map(k=>k.ad).join(' + ')||'—'; }
function gTop(l,k){ return l.reduce((s,i)=>s+(Number(i[k])||0),0); }

/* --- gözlemci (gönderimli dönem) --- */
function gGozlemci(){
  const v=S.veri, iller=v.iller.filter(i=>i.proje>0||i.talep>0);
  const sayac={}; iller.forEach(i=>{ const d=birDurum(i); sayac[d]=(sayac[d]||0)+1; });
  const talep=gTop(iller,'talep'), dus=iller.reduce((s,i)=>s+((i.m&&i.m.dusulen)||0),0), net=gTop(iller,'net'), gon=gTop(iller,'gonderilen'), bek=gTop(iller,'bekleyen');
  const kismi=iller.filter(i=>i.kismi).length, uyar=iller.filter(i=>i.talep>0&&i.m&&i.m.uyarilar.some(u=>u.indexOf('onay bekliyor')>=0||u.indexOf('bilinmiyor')>=0)).length;
  let h=donemBaslik()+'<div class="kartlar">'+
    kpi('Onaylı proje', iller.reduce((s,i)=>s+i.proje,0)+' proje · '+iller.length+' il')+
    kpi('Talep toplamı', tl0(talep), iller.filter(i=>i.talep>0).length+' il')+
    kpi('Düşülen kalan', tl0(dus), kaynakAd()+(uyar?' · ⚠ '+uyar+' ilde kalan onay/bilgi bekliyor':''))+
    kpi('Gönderilecek net', tl0(net), 'talep − düşülen kalan')+
    kpi('Gönderilen', tl0(gon), iller.filter(i=>i.gonderilen>0).length+' il', false, net?gon/net:0)+
    kpi('Henüz gönderilmeyen', tl0(bek), (kismi?kismi+' il kısmen aktarıldı · ':'')+iller.filter(i=>i.bekleyen>0).length+' il', true)+
  '</div>';
  h+='<div style="margin:-4px 0 12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn ana" onclick="gBekleyenAc()">📋 Henüz gönderilmeyenler ('+tl0(bek)+')</button></div>';
  const dkT=k=>iller.filter(i=>dk(i.aktDurum)===k).reduce((s,i)=>s+(k==='1'?i.planlanmamis:i.yolda||0),0);
  h+=akis('Para şu an nerede?',[['Kalanla karşılanan',dus,'#8FBF9F'],['Henüz planlanmadı',gTop(iller,'planlanmamis'),'#E9B44C'],['Yönetimde',dkT('2'),'#D3A2C4'],['Hazine sürecinde',dkT('3'),'#A8627F'],['Gönderildi',gon,'#6B2D5C']],talep);
  const hb={}; v.iller.forEach(i=>{ if(!(i.proje>0||i.talep>0)){ hb[i.il]={renk:'#F4EFEB',pasif:true,durum:'Onaylı projesi yok'}; return; }
    const d=birDurum(i); hb[i.il]={renk:HRENK[d]||'#D8CFC8',durum:d,alt:'Net '+tl0(i.net)+' · Gönderilen '+tl0(i.gonderilen)+(i.bekleyen>0?' · Bekleyen '+tl0(i.bekleyen):'')}; });
  h+=harita(hb, DURUMLAR.filter(d=>sayac[d[0]]).map(d=>[d[0]+' ('+sayac[d[0]]+')',HRENK[d[0]]||'#D8CFC8',"filtre('"+(S.filtre===d[0]?'':d[0])+"')",S.filtre===d[0]]), ilDetay, S.filtre?(il=>hb[il]&&hb[il].durum===S.filtre):null);
  h+='<div class="cipler"><button class="cip'+(S.filtre===''?' secili':'')+'" onclick="filtre(\'\')">Tümü ('+iller.length+')</button>'+
    DURUMLAR.filter(d=>sayac[d[0]]).map(d=>'<button class="cip'+(S.filtre===d[0]?' secili':'')+'" onclick="filtre(\''+d[0]+'\')">'+esc(d[0])+' ('+sayac[d[0]]+')</button>').join('')+'</div>';
  h+='<input class="ara" placeholder="İl ara…" value="'+esc(S.ara)+'" oninput="S.ara=this.value;listeCiz()">';
  h+='<div class="liste" id="liste"></div><p class="kucuk" style="margin-top:14px">Son güncelleme: '+new Date(v.zaman).toLocaleString('tr-TR')+' · Düşülen kalanlar: '+esc(kaynakAd())+'. Projesi olmayan iller listelenmez.</p>';
  $('ana').innerHTML=h; listeCiz();
}

/* --- il ayrıntısı: düşme tablosu + gönderimler --- */
function gMahsupTablo(i){
  if(!i.m||!(i.talep>0)) return '<div class="bos" style="padding:10px">Talep girilmedi.</div>';
  const m=i.m, ks=Object.keys(m.dus).sort(), kul=[0,1,2,3,4].filter(j=>m.talep[j]>0||m.dusToplam[j]>0||(i.kodGonderilen||[])[j]>0);
  const ad=kd=>((S.veri.kaynaklar||[]).find(k=>k.id===kd)||{ad:kd+'. Dönem'}).ad;
  let h='<div style="overflow-x:auto;margin-top:8px"><table class="t" style="min-width:560px"><thead><tr><th>Kod</th><th style="text-align:right">Talep</th>'+ks.map(kd=>'<th style="text-align:right">− '+esc(ad(kd))+'</th>').join('')+
    '<th style="text-align:right">Net</th><th style="text-align:right">Gönderilen</th><th style="text-align:right">Bekleyen</th></tr></thead><tbody>'+
    kul.map(j=>'<tr><td>'+GKOD[j]+'</td><td class="s">'+tl(m.talep[j])+'</td>'+ks.map(kd=>'<td class="s">'+(m.dus[kd][j]?'−'+tl(m.dus[kd][j]):'—')+'</td>').join('')+
      '<td class="s"><b>'+tl(m.net[j])+'</b></td><td class="s">'+tl((i.kodGonderilen||[])[j]||0)+'</td><td class="s">'+tl((i.kodBekleyen||[])[j]||0)+'</td></tr>').join('')+
    '<tr style="font-weight:700"><td>Toplam</td><td class="s">'+tl(i.talep)+'</td>'+ks.map(kd=>{ const t=m.dus[kd].reduce((s,x)=>s+x,0); return '<td class="s">'+(t>0.004?'−'+tl(t):'—')+'</td>'; }).join('')+
    '<td class="s">'+tl(i.net)+'</td><td class="s">'+tl(i.gonderilen)+'</td><td class="s">'+tl(i.bekleyen)+'</td></tr></tbody></table></div>';
  if(m.uyarilar.length) h+='<div class="uyarik">⚠ '+m.uyarilar.map(esc).join('<br>⚠ ')+'</div>';
  if(m.notlar.length) h+='<div class="kucuk" style="margin-top:6px;background:#F7F2EE;border-radius:8px;padding:6px 10px">ℹ '+m.notlar.map(esc).join('<br>ℹ ')+'</div>';
  return h;
}
function gGonderimListe(i,duzen){

    const kd=[0,1,2,3,4].filter(j=>g.kod[j]>0).map(j=>GKOD[j]+' '+tl0(g.kod[j])).join(' · ');
    const adim=[g.yTarih||g.ySayi?'Yönetime yazı '+(g.yTarih?trTarih(g.yTarih):'')+(g.ySayi?' · '+g.ySayi:''):'',
      g.aTarih||g.aSayi?'Aktarım yazısı '+(g.aTarih?trTarih(g.aTarih):'')+(g.aSayi?' · '+g.aSayi:''):'',
      g.hTarih||g.hNo?'Ödeme emri '+(g.hTarih?trTarih(g.hTarih):'')+(g.hNo?' · No '+g.hNo:''):'',
      g.nTarih?'Nakit '+trTarih(g.nTarih):''].filter(Boolean).join(' → ');
    return '<div class="altkutu" style="margin-top:8px"><div class="altbaslik" style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span>'+g.no+'. gönderim · <b class="para">'+tl(g.toplam)+'</b></span>'+

      '<div class="kucuk">'+esc(kd)+'</div>'+(adim?'<div class="kucuk" style="margin-top:3px">'+esc(adim)+'</div>':'')+
      (duzen?'<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn ikincil" style="padding:6px 12px" onclick="gFormAc('+g.no+')">Düzenle / tarih gir</button>'+

function gOner(){
  const tp=S.tp, sec=S.veri.iller.filter(i=>tp.iller.indexOf(i.il)>=0&&i.planlanmamis>0.004);

  const hedef = (b===''||Number.isNaN(b)||!(b>0)) ? top : Math.min(b,top);
  tp.gp.oneri={}; let kalan=r2c(hedef);
  sec.forEach((i,k)=>{ const v = k===sec.length-1 ? kalan : Math.min(i.planlanmamis, Math.floor(hedef*i.planlanmamis/top)); tp.gp.oneri[i.il]=r2c(v); kalan=r2c(kalan-v); });
  tp.gp.kontrol=false; topluCiz(); if(b>top) toast('Bütçe, planlanmamış toplamdan büyük; en çok '+tl0(top)+' önerildi.');

}

/* --- anında açılış: son görülen veri cihazda saklanır (yalnız gözlemci görünümü; veri girişinde her zaman taze veri beklenir) --- */
function saklaOku(k){ try{ const s=localStorage.getItem('unides_v2_'+k); return s?JSON.parse(s):null; }catch(e){ return null; } }
function saklaYaz(k,v){ try{ localStorage.setItem('unides_v2_'+k, JSON.stringify(v)); }catch(e){} }
function tazelik(m,bitti){ const t=$('tazelik'); if(!t) return; t.textContent=m; t.className='tazelik acik'+(bitti?' bitti':''); clearTimeout(t._z); if(bitti) t._z=setTimeout(()=>{ t.className='tazelik'; },1600); }

/* --- sayarak yükselen rakamlar --- */
function sayAnim(kok){
  if(AZHAREKET) return;
  (kok||document).querySelectorAll('.kpi b, .akis-bilgi b').forEach(el=>{
    const metin=el.textContent, parca=[]; let son=0;
    metin.replace(/\d[\d.]*(?:,\d+)?/g,(m,ix)=>{ parca.push(metin.slice(son,ix)); const ond=(m.split(',')[1]||'').length; parca.push({h:parseFloat(m.replace(/\./g,'').replace(',','.')),ond}); son=ix+m.length; return m; });
    parca.push(metin.slice(son)); if(!parca.some(p=>typeof p==='object'&&p.h>0)) return;
    const t0=performance.now(), sure=750;
    const adim=t=>{ const k=Math.max(0,Math.min(1,(t-t0)/sure)), e=1-Math.pow(1-k,3);
      el.textContent=parca.map(p=>typeof p==='string'?p:(p.h*e).toLocaleString('tr-TR',{minimumFractionDigits:p.ond,maximumFractionDigits:p.ond})).join('');
      if(k<1) requestAnimationFrame(adim); else el.textContent=metin; };
    requestAnimationFrame(adim);
  });
}
function halka(p){ p=Math.max(0,Math.min(1,p||0)); return '<svg class="halka" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15" class="hz"/><circle cx="20" cy="20" r="15" class="hd" style="stroke-dashoffset:'+(94.25*(1-p)).toFixed(2)+'"/><text x="20" y="24" text-anchor="middle">'+Math.round(p*100)+'</text></svg>'; }

/* --- para akışı şeridi --- */
function akis(baslik,parcalar,toplam){
  const top=toplam||parcalar.reduce((s,p)=>s+Math.max(0,p[1]),0); if(!(top>0)) return '';
  return '<div class="akis"><div class="akis-ust"><b>'+esc(baslik)+'</b><span class="kucuk">toplam '+tl0(top)+'</span></div>'+
    '<div class="akis-cubuk">'+parcalar.filter(p=>p[1]>0).map(p=>'<div style="flex:'+(p[1]/top).toFixed(5)+' 1 0;background:'+p[2]+'" title="'+esc(p[0])+': '+tl0(p[1])+'"></div>').join('')+'</div>'+
    '<div class="akis-bilgi">'+parcalar.map(p=>'<div class="'+(p[1]>0?'':'sifir')+'"><i style="background:'+p[2]+'"></i><span>'+esc(p[0])+'</span><b>'+tl0(p[1])+'</b><em>%'+Math.round(p[1]/top*100)+'</em></div>').join('')+'</div></div>';
}

/* --- Türkiye haritası --- */
function harita(bilgi, lejant, tikla, secili){
  const H=window.__TR_HARITA; if(!H) return '';
  let kapali=false; try{ kapali=localStorage.getItem('unides_v2_harita')==='0'; }catch(e){}
  S._hb=bilgi; S._ht=tikla;
  const yol=H.il.map((x,n)=>{ const b=bilgi[x[0]]||{renk:'#F1ECE8',pasif:true};
    return '<path d="'+x[1]+'" data-il="'+esc(x[0])+'" fill="'+b.renk+'" class="'+(b.pasif?'pasif':'')+(secili&&!b.pasif&&!secili(x[0])?' sonuk':'')+'" style="animation-delay:'+(n*9)+'ms"/>'; }).join('');
  return '<details class="bolum haritakutu" '+(kapali?'':'open')+' ontoggle="try{localStorage.setItem(\'unides_v2_harita\',this.open?\'1\':\'0\')}catch(e){}"><summary>Harita<span class="sag kucuk">ile dokunun · renk = durum</span></summary>'+
    '<div class="harita"><svg viewBox="'+H.vb.join(' ')+'" role="img" aria-label="Türkiye haritası" onclick="haritaTik(event)" onmousemove="haritaUc(event)" onmouseleave="$(\'ipucu\').style.display=\'none\'">'+yol+'</svg></div>'+
    '<div class="lejant">'+lejant.map(l=>'<button class="'+(l[3]?'on':'')+'" '+(l[2]?'onclick="'+l[2]+'"':'disabled')+'><i style="background:'+l[1]+'"></i>'+esc(l[0])+'</button>').join('')+'</div></details>';
}
function haritaTik(e){ const il=e.target&&e.target.getAttribute&&e.target.getAttribute('data-il'); if(!il) return; const b=(S._hb||{})[il]; if(b&&!b.pasif&&S._ht){ $('ipucu').style.display='none'; S._ht(il); } }
function haritaUc(e){
  const il=e.target&&e.target.getAttribute&&e.target.getAttribute('data-il'), ip=$('ipucu'); if(!il){ ip.style.display='none'; return; }
  const b=(S._hb||{})[il]||{}; ip.innerHTML='<b>'+esc(il)+'</b>'+(b.durum?'<br>'+esc(b.durum):'')+(b.alt?'<br><span>'+esc(b.alt)+'</span>':'');
  ip.style.display='block'; const w=ip.offsetWidth, x=Math.min(window.innerWidth-w-8,Math.max(8,e.clientX+14)); ip.style.left=x+'px'; ip.style.top=(e.clientY+16)+'px';
}

/* --- il kartında adım çizgisi (tam dönem) --- */
const ADIMLAR=['Talep','Yönetime yazı','Aktarım yazısı','Ödeme emri','Nakit ilde','EK-2','Tamam'];
function adimNo(i){ const d=dk(i.durum); let n=0; if(i.talep>0) n=1; if(i.yonetime==='Evet') n=2; if(i.aTarih) n=3; if(i.hTarih) n=4; if(i.nTarih) n=5; if(i.ek2==='Geldi'||d==='5'||d==='6') n=6; if(d==='6') n=7; return n; }
function adimCizgi(i){ const n=adimNo(i); return '<div class="adim" title="'+ADIMLAR.map((a,j)=>(j<n?'✓ ':'○ ')+a).join(' · ')+'">'+ADIMLAR.map((a,j)=>'<i class="'+(j<n?'dolu':'')+(j===n-1?' son':'')+'"></i>').join('')+'<span>'+(n?esc(ADIMLAR[n-1]):'Talep bekleniyor')+'</span></div>'; }

/* --- kayıt tiki --- */
function tik(m){
  const t=$('tik'); if(!t) return; t.querySelector('span').textContent=m||'Kaydedildi';
  t.classList.remove('acik'); void t.offsetWidth; t.classList.add('acik'); clearTimeout(t._z); t._z=setTimeout(()=>t.classList.remove('acik'),1300);
}
/* toplu işlemde iller sırayla tiklenir, sonra pencere kapanır */
function topluTikGoster(iller,no,sonra){
  const sure=Math.min(1900,500+iller.length*28);
  $('panel').innerHTML='<div class="ust"><h2>✓ Toplu işlem '+esc(no)+'</h2></div><div class="ic"><p class="kucuk">'+iller.length+' ile işlendi</p><div class="tikler">'+
    iller.map((il,n)=>'<span style="animation-delay:'+(n*28)+'ms">✓ '+esc(il)+'</span>').join('')+'</div></div>';
  setTimeout(sonra, AZHAREKET?600:sure+500);
}

/* ===================== YÖNETİM ===================== */
function yonetimCiz(){
  const sk=[['d','Dönemler'],['t','Toplu işlemler'],['k','Kullanıcılar'],['g','İşlem geçmişi']];
  if(!sk.some(x=>x[0]===S.sekme)) S.sekme='d';
  $('ana').innerHTML='<div class="sekmeler">'+sk.map(x=>'<button class="'+(S.sekme===x[0]?'on':'')+'" onclick="S.sekme=\''+x[0]+'\';yonetimCiz()">'+x[1]+'</button>').join('')+'</div><div id="ys"><div class="bos">Yükleniyor…</div></div>';
  if(S.sekme==='d') return donemAyarCiz();
  if(S.sekme==='t') return cagir('topluListesi',[S.oturum.token],topluListeCiz);
  if(S.sekme==='k'){ cagir('kullaniciListesi',[S.oturum.token],kullaniciCiz); }
  else cagir('gecmisListesi',[S.oturum.token],l=>{
    $('ys').innerHTML= l.length? '<table class="t"><thead><tr><th>Zaman</th><th>Kullanıcı</th><th>İl</th><th>İşlem</th><th>Ayrıntı</th></tr></thead><tbody>'+
      l.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>' : '<div class="bos">Kayıt yok.</div>';
  });
}
function kullaniciCiz(l){
  $('ys').innerHTML='<p class="kucuk">Boş satırları yeni kullanıcı için doldurup "Aktif" yapın. "Şifreyi 12345 yap" ilk şifreyi verir. 5 hatalı şifre denemesinde hesap kilitlenir: kilidi buradan açarsınız; yönetici hesabının kilidi script adresinden Google ile girince açılır.</p>'+
    l.map(u=>'<div class="bolum" style="padding:10px 14px"><div class="iki"><div class="alan" style="margin-top:0"><label>Kullanıcı adı</label><input class="g" id="ka'+u.satir+'" value="'+esc(u.ad)+'" autocapitalize="none"></div>'+
      '<div class="alan" style="margin-top:0"><label>Ad soyad</label><input class="g" id="ki'+u.satir+'" value="'+esc(u.isim)+'"></div></div>'+
      '<div class="hesap"><label><input type="checkbox" id="kc'+u.satir+'" '+(u.aktif?'checked':'')+'> Aktif</label>'+
      '<label><input type="checkbox" id="ks'+u.satir+'"> Şifreyi 12345 yap</label>'+(u.kilitli?'<label style="color:var(--kirmiziK)"><input type="checkbox" id="kk'+u.satir+'" checked> 🔒 Kilitli (5 hatalı deneme) — kilidi aç</label>':'')+'<span>'+esc(u.rol)+(u.sifreVar?'':' · şifre yok')+(u.son?' · son giriş '+esc(u.son):'')+'</span></div>'+
      '<button class="btn ikincil" style="margin-top:8px;padding:8px 14px" onclick="kullaniciKaydet('+u.satir+')">Kaydet</button></div>').join('');
}
function kullaniciKaydet(s){
  cagir('kullaniciGuncelle',[S.oturum.token,{satir:s,ad:$('ka'+s).value,isim:$('ki'+s).value,aktif:$('kc'+s).checked,sifirla:$('ks'+s).checked,kilitAc:!!($('kk'+s)&&$('kk'+s).checked)}],r=>{
    if(!r.ok){ toast(r.mesaj); return; } kullaniciCiz(r.liste); toast('Kullanıcı kaydedildi.');
  });
}
</script>
